<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e2e fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; min-height: 200vh; }
  </style>
  <!-- ?theme=1 → a host theme on :root that must pierce the shadow DOM -->
  <style id="host-theme" media="not all">
    :root { --base-accent-color: rgb(255, 0, 128); --base-rem: 16px; }
  </style>
</head>
<body>
  <input id="outside" placeholder="outside input">
  <button id="opener" type="button">open</button>
  <web-command-palette id="palette"></web-command-palette>

  <script type="module">
    import '../src/index.ts';

    const params = new URLSearchParams(location.search);
    if (params.has('theme')) document.getElementById('host-theme').media = 'all';

    const palette = document.getElementById('palette');
    window.calls = { search: [], stepOptions: [] };
    window.events = [];
    for (const name of ['cp-open', 'cp-close', 'cp-select', 'cp-complete', 'cp-command', 'cp-ready']) {
      palette.addEventListener(name, (e) => window.events.push({ name, detail: e.detail }));
    }
    document.getElementById('opener').addEventListener('click', () => palette.open());

    palette.commands = [
      {
        id: 'deploy', shortcut: '/deploy', aliases: ['/d'], hotkey: 'g d', name: 'Deploy to Environment', description: 'Deploy a branch',
        steps: [
          { id: 'env', prompt: ' to ', options: [
            { id: 'prod', label: 'Production', value: 'production' },
            { id: 'staging', label: 'Staging', value: 'staging' },
          ] },
          { id: 'branch', prompt: ' branch ', search: true },
          { id: 'note', prompt: ' note ', freeText: true },
        ],
      },
      { id: 'go', shortcut: '/go', hotkey: 'g g', name: 'Go to Page', description: 'Navigate to a page',
        steps: [{ id: 'page', options: [{ label: 'Home', value: '/' }, { label: 'Users', value: '/users' }] }] },
      { id: 'reload', shortcut: '/reload', hotkey: 'g r', name: 'Reload Data', description: 'Instant' },
    ];
    palette.contexts = [
      { id: 'products', shortcut: ':products', aliases: [':p'], name: 'Products', description: 'Search products' },
      { id: 'users', shortcut: ':users', aliases: [':u'], name: 'Users', description: 'Search users' },
    ];

    if (!params.has('nosearch')) {
      palette.searchCallback = (scope, query) => {
        window.calls.search.push({ scope, query });
        const count = query === 'many' ? 20 : 3;
        const name = scope === 'global' ? 'Global' : scope.contextId;
        return new Promise((resolve) => setTimeout(() => resolve(
          Array.from({ length: count }, (_, i) => ({ id: `${name}-${i}`, title: `${name} ${query} ${i}`, subtitle: `hit ${i}`, badge: 'Hit', badgeVariant: 'info' }))
        ), 20));
      };
    }
    palette.stepOptionsCallback = ({ commandId, stepId, query, selections }) => {
      window.calls.stepOptions.push({ commandId, stepId, query, selections });
      if (stepId === 'branch') return [`main`, `feature/${query || 'x'}`].map((b) => ({ id: b, label: b, value: b }));
      return [];
    };
    window.ready = true;
  </script>
</body>
</html>
